# Khabar Hub: collect the news every 15 minutes, post alerts and bulletins,
# and publish the website on GitHub Pages.
#
# To turn it on, copy this file to .github/workflows/news-hub.yml and merge it
# into the default branch (README.md, "Put it online"). Scheduled runs only
# happen on the default branch.

name: News Hub

on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub often starts scheduled runs 5-30 minutes late
  workflow_dispatch:
    inputs:
      bulletin:
        description: "Make a bulletin now, whatever the time"
        type: boolean
        default: false
      publish:
        description: "Really post (off: posts are only printed in the log)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: news-hub
  cancel-in-progress: false

env:
  NEWS_DIR: news-hub            # the folder holding newshub/ ("." if it is the repository's root)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.NEWS_DIR }}/requirements.txt

      - name: System packages (video, fonts, fallback voice)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core espeak-ng libraqm0

      - name: Python packages
        working-directory: ${{ env.NEWS_DIR }}
        run: pip install -r requirements.txt

      # The stories, what was already posted, and the latest videos live in data/
      # between runs. Nothing secret is kept there: anyone who can run this
      # repository's workflows can read its caches.
      - name: Restore stories and state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NEWS_DIR }}/data
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-

      - name: Restore Piper voices
        uses: actions/cache@v4
        with:
          path: ~/.cache/newshub/voices
          key: piper-voices-${{ hashFiles(format('{0}/config.yaml', env.NEWS_DIR)) }}
          restore-keys: piper-voices-

      - name: Collect, alert, bulletin, build the site
        working-directory: ${{ env.NEWS_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          BULLETIN: ${{ inputs.bulletin }}
        run: |
          args=""
          [ "$PUBLISH" = "true" ] && args="$args --publish"
          [ "$BULLETIN" = "true" ] && args="$args --bulletin"
          python -m newshub run $args

      - name: Save stories and state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NEWS_DIR }}/data
          key: news-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.NEWS_DIR }}/site

      - id: deploy
        uses: actions/deploy-pages@v4
