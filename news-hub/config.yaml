# News Hub settings. Secrets (API keys, tokens) never go here: they are
# read from environment variables (GitHub Actions secrets), listed in README.md.

site:
  name: "News Bell"
  name_ne: "न्युज बेल"
  tagline: "Nepal and world news, gathered every 15 minutes"
  base_url: "https://silent4-u.github.io/Manish8u/"  # the GitHub Pages address of the repo it runs in
  timezone: "Asia/Kathmandu"
  keep_days: 3                  # how long stories stay on the site
  per_section: 24               # stories per section on the home page

# Sections, in the order shown. Each story gets the category whose words it
# matches most (English and Nepali); with no match it stays "general".
categories:
  - slug: politics
    name: Politics
    name_ne: राजनीति
    color: "#c62828"
    words: [government, minister, parliament, election, party, prime minister, president, cabinet, congress, uml,
            maoist, protest, vote, diplomat, sanction, सरकार, मन्त्री, संसद, निर्वाचन, चुनाव, पार्टी, प्रधानमन्त्री,
            राष्ट्रपति, मन्त्रिपरिषद्, कांग्रेस, एमाले, माओवादी, आन्दोलन]
  - slug: economy
    name: Economy
    name_ne: अर्थ
    color: "#2e7d32"
    words: [economy, market, bank, budget, inflation, trade, stock, nepse, rupee, dollar, investment, tax, gdp,
            remittance, price, business, अर्थतन्त्र, बजार, बैंक, बजेट, मूल्यवृद्धि, व्यापार, सेयर, नेप्से, रुपैयाँ, लगानी,
            कर, रेमिट्यान्स, मूल्य]
  - slug: disaster
    name: Disaster & Weather
    name_ne: विपद् र मौसम
    color: "#e65100"
    words: [earthquake, flood, landslide, avalanche, storm, cyclone, monsoon, rain, snow, wildfire, fire, drought,
            tsunami, weather, evacuat, rescue, भूकम्प, बाढी, पहिरो, हिमपहिरो, आँधी, वर्षा, हिमपात, आगलागी, डढेलो,
            खडेरी, मौसम, उद्धार]
  - slug: sports
    name: Sports
    name_ne: खेलकुद
    color: "#1565c0"
    words: [cricket, football, match, tournament, cup, league, olympic, athlete, goal, wicket, coach, champion,
            क्रिकेट, फुटबल, खेल, प्रतियोगिता, कप, लिग, खेलाडी, गोल, विकेट, प्रशिक्षक, च्याम्पियन]
  - slug: technology
    name: Technology
    name_ne: प्रविधि
    color: "#6a1b9a"
    words: [technology, internet, ai, artificial intelligence, app, smartphone, cyber, software, startup, digital,
            satellite, space, प्रविधि, इन्टरनेट, एप, मोबाइल, साइबर, सफ्टवेयर, डिजिटल, भू-उपग्रह]
  - slug: health
    name: Health
    name_ne: स्वास्थ्य
    color: "#00838f"
    words: [health, hospital, disease, virus, vaccine, doctor, patient, outbreak, dengue, cholera, covid, medicine,
            स्वास्थ्य, अस्पताल, रोग, भाइरस, खोप, चिकित्सक, बिरामी, डेंगु, हैजा, औषधि]
  - slug: entertainment
    name: Entertainment
    name_ne: मनोरञ्जन
    color: "#ad1457"
    words: [film, movie, music, actor, actress, singer, festival, concert, celebrity, song, चलचित्र, फिल्म, संगीत,
            अभिनेता, अभिनेत्री, गायक, गायिका, चाड, कन्सर्ट, गीत]

# Stories about Nepal from world sources are moved to the Nepal section.
nepal_words: [nepal, kathmandu, pokhara, lalitpur, bhaktapur, biratnagar, birgunj, everest, himalaya, terai,
              नेपाल, काठमाडौं, पोखरा, ललितपुर, भक्तपुर, विराटनगर, वीरगञ्ज, सगरमाथा, हिमाल, तराई]

bulletins:
  times: ["06:00", "12:00", "17:00", "21:00"]   # Nepal time; add more times to post more often
  window_minutes: 60      # the first run up to this long after a time makes that bulletin
                          # (GitHub's scheduled runs are often 5-30 minutes late)
  stories: 5
  nepal_stories: 3        # how many of them are from Nepal

emergency:
  # auto:   post at once when at least `min_sources` different sources report the
  #         same event within `window_hours`, or an official feed (USGS, GDACS) does.
  # review: send every alert to the admin Telegram chat only; a person posts it.
  mode: auto
  min_sources: 2
  window_hours: 6
  max_age_hours: 3        # only alert on news this fresh
  words: [earthquake, tsunami, flood, flash flood, landslide, avalanche, cyclone, wildfire, explosion, blast,
          plane crash, bus accident, collapse, evacuation, state of emergency, curfew, glacial lake, outburst,
          भूकम्प, सुनामी, बाढी, पहिरो, हिमपहिरो, विस्फोट, दुर्घटना, कर्फ्यु, संकटकाल, हिमताल]
  usgs_nepal_magnitude: 4.0    # quakes in or near Nepal at least this strong
  usgs_world_magnitude: 6.5    # quakes anywhere at least this strong
  gdacs_levels: [Red, Orange]

video:
  enabled: true
  formats: [vertical]     # vertical (1080x1920: Reels, Shorts, TikTok) and/or horizontal (1920x1080)
  language: en            # en or ne: narration and on-screen summary language
  fps: 25
  voice:
    engine: auto          # auto: Azure if its key is set, else Piper. Or: azure, piper
    speed: 1.0            # 0.9 is slower and calmer, 1.1 faster
    allow_robotic: false  # with no natural voice: false = no narration, true = espeak-ng (robotic)
    piper:                # free voices, tried in order; downloaded once and cached
      en: [en_US-ryan-high, en_US-lessac-high, en_US-lessac-medium]
      ne: [ne_NP-google-medium, ne_NP-google-x_low]
    azure:                # needs AZURE_SPEECH_KEY and AZURE_SPEECH_REGION (README.md)
      en: en-US-AndrewNeural
      ne: ne-NP-SagarNeural     # or ne-NP-HemkalaNeural (female)
  music: true
  handles: "@newsbellnepal"   # shown on the closing card and the bottom bar

ai:
  enabled: auto           # auto: on when ANTHROPIC_API_KEY is set
  model: claude-opus-5-5
  effort: low
  batch: 15               # stories per request
  max_per_run: 60

# Where videos and posts go. A platform posts only when it is enabled here AND
# its secrets are set (README.md lists them); otherwise it is skipped.
publish:
  youtube: {enabled: true, privacy: public}            # the vertical video as a YouTube Short
  tiktok: {enabled: true, mode: direct, privacy: PUBLIC_TO_EVERYONE}
                       # direct: posted at once (private until TikTok's app audit is passed)
                       # draft:  sent to the TikTok app's inbox; you tap post (no audit needed)
  facebook: {enabled: true, graph_version: v21.0}      # a Facebook Page: the video as a Reel, plus a link post
  instagram: {enabled: true, graph_version: v21.0}     # an Instagram professional account: the video as a Reel
  telegram: {enabled: false}                           # optional channel; its admin chat is used for review mode
  x: {enabled: false}                                  # optional: text and link; X's API may need a paid plan
